<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js 1D PIC Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

// --- Simulation Parameters ---
const NX = 64;             // Cells
const NPPC = 1000;          // Particles Per Cell
const TOTAL_P = NX * NPPC; // Total Particles
const TEX_SIZE = Math.ceil(Math.sqrt(TOTAL_P)); // Texture dimensions (80x80)

const DX = 1.0 / NX;

// --- 1. Setup Main Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(); 

// ==========================================
// NEW: GRID COMPUTE SETUP (NX x 1)
// ==========================================
const gpuGrid = new GPUComputationRenderer(NX, 1, renderer);

const dtPotential = gpuGrid.createTexture();
const dtEField = gpuGrid.createTexture();

// Jacobi Iteration Shader (Solves Poisson)
const jacobiShader = `
    uniform sampler2D u_rho;
    uniform float u_dx;
    void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        float rho = texture2D(u_rho, uv).r;
        
        // Fetch neighbors with periodic wrap-around using fract()
        float dx = 1.0 / resolution.x;
        float phi_left = texture2D(texturePotential, fract(uv - vec2(dx, 0.0))).r;
        float phi_right = texture2D(texturePotential, fract(uv + vec2(dx, 0.0))).r;
        
        // Jacobi Update: phi = (phi_left + phi_right + rho * dx^2) / 2
        float phi_new = (phi_left + phi_right + rho * u_dx * u_dx) * 0.5;
        
        gl_FragColor = vec4(phi_new, 0.0, 0.0, 1.0);
    }
`;

// E-Field Shader (E = -grad(phi))
const efieldShader = `
    uniform float u_dx;
    void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        float dx = 1.0 / resolution.x;
        
        float phi_left = texture2D(texturePotential, fract(uv - vec2(dx, 0.0))).r;
        float phi_right = texture2D(texturePotential, fract(uv + vec2(dx, 0.0))).r;
        
        // Central difference
        float E = -(phi_right - phi_left) / (2.0 * u_dx);
        gl_FragColor = vec4(E, 0.0, 0.0, 1.0);
    }
`;

const potentialVar = gpuGrid.addVariable("texturePotential", jacobiShader, dtPotential);
const efieldVar = gpuGrid.addVariable("textureEField", efieldShader, dtEField);

// Both depend on potential to update iteratively
gpuGrid.setVariableDependencies(potentialVar, [potentialVar]);
gpuGrid.setVariableDependencies(efieldVar, [potentialVar]);

potentialVar.material.uniforms.u_rho = { value: null };
potentialVar.material.uniforms.u_dx = { value: DX };
efieldVar.material.uniforms.u_dx = { value: DX };

gpuGrid.init();

// ==========================================
// 2. PARTICLE COMPUTE SETUP (80 x 80)
// ==========================================
const gpuParticles = new GPUComputationRenderer(TEX_SIZE, TEX_SIZE, renderer);
const dtState = gpuParticles.createTexture();
const data = dtState.image.data;

for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.random(); // X Position (Uniform)
    data[i + 1] = (Math.sin(data[i] * Math.PI * 2)) * 0.06 + 0.05 * (Math.random() - 0.5) + (Math.random() * data[i] * data[i]) * 0.5 * (Math.random() - 1.0) + (Math.cos(data[i] * Math.PI * 2)) * 0.04; // V Perturbation
    data[i + 2] = 0;
    data[i + 3] = 1;
}

const particleShader = `
    #define MAX_V 0.2
    uniform float u_dt;
    uniform sampler2D u_field; 
    
    void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        vec4 state = texture2D(textureParticle, uv);
        float x = state.r;
        float v = state.g;

        // Fetch E-field from grid (Nearest grid point)
        float E = texture2D(u_field, vec2(x, 0.5)).r;

        // Push
        v += E * u_dt;
        v = clamp(v, -MAX_V, MAX_V);
        x = fract(x + v * u_dt);

        gl_FragColor = vec4(x, v, 0.0, 1.0);
    }
`;

const particleVar = gpuParticles.addVariable("textureParticle", particleShader, dtState);
gpuParticles.setVariableDependencies(particleVar, [particleVar]);
particleVar.material.uniforms.u_dt = { value: 0.01 };
particleVar.material.uniforms.u_field = { value: null };

gpuParticles.init();

// ==========================================
// NEW: CHARGE DEPOSITION SETUP (Scatter)
// ==========================================
// We draw particles as points onto this 64x1 texture to sum their charge
const rhoTarget = new THREE.WebGLRenderTarget(NX, 1, {
    format: THREE.RedFormat,
    type: THREE.HalfFloatType,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter
});
const rhoScene = new THREE.Scene();
const rhoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const geometry = new THREE.BufferGeometry();
const uvs = new Float32Array(TOTAL_P * 2);
for (let i = 0; i < TOTAL_P; i++) {
    uvs[i*2] = (i % TEX_SIZE) / TEX_SIZE;
    uvs[i*2+1] = Math.floor(i / TEX_SIZE) / TEX_SIZE;
}
geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TOTAL_P * 3), 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const rhoMaterial = new THREE.ShaderMaterial({
    uniforms: {
        u_stateTex: { value: null },
        u_charge: { value: -1.0 / NPPC } // Electrons are negative
    },
    vertexShader: `
        uniform sampler2D u_stateTex;
        void main() {
            float x = texture2D(u_stateTex, uv).r;
            // Map [0, 1] to WebGL clip space [-1, 1]
            gl_Position = vec4(x * 2.0 - 1.0, 0.0, 0.0, 1.0);
            gl_PointSize = 1.0; 
        }
    `,
    fragmentShader: `
        uniform float u_charge;
        void main() {
            gl_FragColor = vec4(u_charge, 0.0, 0.0, 1.0);
        }
    `,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    transparent: true
});
const rhoPoints = new THREE.Points(geometry, rhoMaterial);
rhoPoints.frustumCulled = false;
rhoScene.add(rhoPoints);


// ==========================================
// 4. MAIN VISUALS SETUP
// ==========================================
const visualMaterial = new THREE.ShaderMaterial({
    uniforms: { u_stateTex: { value: null } },
    vertexShader: `
        uniform sampler2D u_stateTex;
        void main() {
            vec4 data = texture2D(u_stateTex, uv);
            float x = data.r * 2.0 - 1.0; 
            float v = data.g * 5.0;       
            gl_Position = vec4(x, v, 0.0, 1.0);
            gl_PointSize = 2.0;
        }
    `,
    fragmentShader: `
        void main() { gl_FragColor = vec4(0.0, 0.8, 1.0, 1.0); }
    `
});
const visualPoints = new THREE.Points(geometry, visualMaterial);
visualPoints.frustumCulled = false;
scene.add(visualPoints);


// ==========================================
// 5. ANIMATION LOOP
// ==========================================
function animate() {
    requestAnimationFrame(animate);

    const currentState = gpuParticles.getCurrentRenderTarget(particleVar).texture;

    // --- A. DEPOSIT CHARGE ---
    rhoMaterial.uniforms.u_stateTex.value = currentState;
    renderer.setRenderTarget(rhoTarget);
    // Fill background with +1.0 (Positive Ion Background)
    renderer.setClearColor(new THREE.Color(1.0, 0, 0)); 
    renderer.clear();
    renderer.render(rhoScene, rhoCamera);

    // --- B. SOLVE GRID (Poisson & E-Field) ---
    potentialVar.material.uniforms.u_rho.value = rhoTarget.texture;
    // Run Jacobi 20 times to converge
    for(let i=0; i<20; i++) {
        gpuGrid.compute();
    }
    const currentEField = gpuGrid.getCurrentRenderTarget(efieldVar).texture;

    // --- C. PUSH PARTICLES ---
    particleVar.material.uniforms.u_field.value = currentEField;
    gpuParticles.compute();

    // --- D. RENDER TO SCREEN ---
    renderer.setRenderTarget(null); // Back to screen
    visualMaterial.uniforms.u_stateTex.value = currentState;

    const w = window.innerWidth;
    const h = window.innerHeight;

    const topHeight = h * 0.05;    // Top 5%
    const bottomHeight = h * 0.95; // Bottom 95%

    renderer.setScissorTest(true);

    // Top: Empty
    renderer.setViewport(0, bottomHeight, w, topHeight);
    renderer.setScissor(0, bottomHeight, w, topHeight);
    renderer.setClearColor(0x050505);
    renderer.clear();

    // Bottom: Simulation
    renderer.setViewport(0, 0, w, bottomHeight);
    renderer.setScissor(0, 0, w, bottomHeight);
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
