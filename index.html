<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js PIC Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
}
</script>


<script type="module">
import * as THREE from 'three';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

// --- Simulation Parameters ---
const NX = 64;             // Cells
const NPPC = 100;            // Particles Per Cell
const TOTAL_P = NX * NPPC; // Total Particles
const TEX_SIZE = Math.ceil(Math.sqrt(TOTAL_P)); // Texture dimensions

// --- 1. Setup Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.Camera(); // Orthographic for 2D plot

// --- 2. GPU Computation Setup ---
const gpuCompute = new GPUComputationRenderer(TEX_SIZE, TEX_SIZE, renderer);

// Initial state: Random X, Small velocity perturbation
const dtState = gpuCompute.createTexture();
const data = dtState.image.data;
for (let i = 0; i < data.length; i += 4) {
    data[i] = Math.random(); // X Position
    // console.log(data[i])
    data[i + 1] = (Math.sin(Math.random() * Math.PI * 2)) * 0.1; // V Velocity
    data[i + 2] = 0;
    data[i + 3] = 1;
}

// Particle Physics Shader (The "Push")
const particleShader = `
    #define MAX_V 3.0
    uniform float u_dt;
    uniform sampler2D u_field; // Solved E-Field from Poisson
    void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        vec4 state = texture2D(textureParticle, uv);
        float x = state.r;
        float v = state.g;

        // Fetch E-field (Gather)
        float E = texture2D(u_field, vec2(x, 0.5)).r;

        // Update Physics (Newton-Lorentz)
        v += E * u_dt;
        v = clamp(v, -MAX_V, MAX_V);
        x = fract(x + v * u_dt); // Periodic boundary

        gl_FragColor = vec4(x, v, 0.0, 1.0);
    }
`;

const particleVar = gpuCompute.addVariable("textureParticle", particleShader, dtState);
gpuCompute.setVariableDependencies(particleVar, [particleVar]);
particleVar.material.uniforms.u_dt = { value: 0.016 };
particleVar.material.uniforms.u_field = { value: null };

const error = gpuCompute.init();
if (error !== null) console.error(error);

// --- 3. Field Solving (Poisson / Thomas Algorithm) ---
// Note: In a production env, we'd do this via a custom shader pass.
// For this demo, we simulate the field on the CPU or via a secondary FBO.
const fieldTexture = new THREE.DataTexture(new Float32Array(NX * 4), NX, 1, THREE.RGBAFormat, THREE.FloatType);

// --- 4. The Visuals (Phase Space Plot) ---
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(TOTAL_P * 3);
const uvs = new Float32Array(TOTAL_P * 2);

for (let i = 0; i < TOTAL_P; i++) {
    uvs[i * 2] = (i % TEX_SIZE) / TEX_SIZE;
    uvs[i * 2 + 1] = Math.floor(i / TEX_SIZE) / TEX_SIZE;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const material = new THREE.ShaderMaterial({
    uniforms: {
        u_stateTex: { value: null },
        u_split: { value: 0.5 }
    },
    vertexShader: `
        #define MAX_V 0.5
        uniform sampler2D u_stateTex;
        uniform float u_split;
        void main() {


            vec4 data = texture2D(u_stateTex, uv);
            float x = data.r * 2.0 - 1.0; // Map [0,1] to [-1,1]
            float v = data.g * 5.0;       // Scale velocity for visibility
            
            // Offset to bottom half
            float y = 2.0 * v ; 
            
            gl_Position = vec4(x, y, 0.0, 1.0);
            gl_PointSize = 5.0;
        }
    `,
    fragmentShader: `
        void main() {
            gl_FragColor = vec4(0.0, 0.8, 1.0, 1.0);
        }
    `
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// --- 5. Animation Loop ---
function animate() {
    requestAnimationFrame(animate);

    // Run GPU Compute
    gpuCompute.compute();

    // Update Visuals
    const currentState = gpuCompute.getCurrentRenderTarget(particleVar).texture;
    material.uniforms.u_stateTex.value = currentState;

    // Viewport Splitting
    const w = window.innerWidth;
    const h = window.innerHeight;

    renderer.setScissorTest(true);

    // Top: Empty
    renderer.setViewport(0, h/2, w, h/2);
    renderer.setScissor(0, h/2, w, h/2);
    renderer.setClearColor(0x050505);
    renderer.clear();

    // Bottom: Simulation
    renderer.setViewport(0, 0, w, h/2);
    renderer.setScissor(0, 0, w, h/2);
    renderer.render(scene, camera);
}

animate();

// Handle Resize
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
